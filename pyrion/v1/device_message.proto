syntax = "proto3";

package pyrion.v1.device_message;


message DeviceMessage {
  oneof payload {
    DeviceIntroduction deviceIntroduction = 1;
    Telemetry telemetry = 2;
    Success success = 3;
    Failure failure = 4;
    FaultRegister faultRegister = 5;
  }
}

message DeviceIntroduction{
  string firmware = 3;
  string uid = 5;
}

message Telemetry{
  float cpu_temp = 1;
  float driver_temp = 2;
  float motor_temp = 3;
  float v_bus = 4;
  float power = 5;
  float current = 6;
  float duty_cycle = 7;
  uint64 uptime = 8;
  uint32 active_faults = 9;
  uint32 latched_faults = 10;
}

message FaultRegister{
  repeated FaultEntry faults = 1;
}

message Success {}

message Failure {}

message FaultEntry {
  FaultType type = 1;
  FaultState state = 2;
}

enum FaultType{
  FAULT_TYPE_UNSPECIFIED = 0;
  ENCODER = 1;
}

enum FaultState {
  FAULT_STATE_UNSPECIFIED = 0;
  ACTIVE = 1;
  LATCHED = 2;
}