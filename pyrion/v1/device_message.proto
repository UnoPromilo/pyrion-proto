syntax = "proto3";

package pyrion.v1.device_message;


message DeviceMessage {
  oneof payload {
    DeviceIntroduction deviceIntroduction = 1;
    Telemetry telemetry = 2;
    Success success = 3;
    Failure failure = 4;
    ErrorRegister errorRegister = 5;
  }
}

message DeviceIntroduction{
  string firmware = 3;
  string uid = 5;
}

message Telemetry{
  float cpu_temp = 1;
  float driver_temp = 2;
  float motor_temp = 3;
  float v_bus = 4;
  float power = 5;
  float current = 6;
  float duty_cycle = 7;
  uint64 uptime = 8;
  uint32 ongoing_errors = 9;
  uint32 resolved_errors = 10;
}

message ErrorRegister{
  repeated ErrorEntry errors = 1;
}

message Success {}

message Failure {}

message ErrorEntry {
  ErrorType error = 1;
  ErrorState state = 2;
}

enum ErrorType{
  ERROR_TYPE_UNSPECIFIED = 0;
  ENCODER = 1;
}

enum ErrorState {
  ERROR_STATE_UNSPECIFIED = 0;
  ERROR_STATE_ACTIVE = 1;
  ERROR_STATE_RESOLVED = 2;
}